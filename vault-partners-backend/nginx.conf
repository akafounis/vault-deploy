server {
    listen 80;
    server_name vault-partners.eu www.vault-partners.eu;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name vault-partners.eu www.vault-partners.eu;

    ssl_certificate     /etc/letsencrypt/live/vault-partners.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vault-partners.eu/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size 100M;

    location /static/ {
        alias /var/www/vault-partners/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /uploads/ {
        alias /var/www/vault-partners/uploads/;
        # Protect uploads from direct access if needed
        # internal;
    }

    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
}
